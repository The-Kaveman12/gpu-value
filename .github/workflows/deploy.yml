name: Refresh prices and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  issues: # new or edited price alerts get checked right away
    types: [opened, edited, reopened, closed]
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test health alert (opens an issue; the next normal run closes it)
        type: boolean
        default: false

permissions:
  contents: write # push the price-history branch
  pages: write
  id-token: write
  issues: write # health alerts

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Issue events only matter for price alerts.
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'price-watch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build catalog
        run: npm run build
      - name: Fetch prices (retail tracker, eBay API, eBay snapshot)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export PREVIOUS_PRICES_URL="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/data/prices.json"
          node scripts/fetch-prices.mjs
      - name: Check price data health (opens/closes a GitHub issue)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_TEST_ALERT: ${{ inputs.test_alert }}
        run: node scripts/report-health.mjs
      - name: Load price history
        uses: actions/checkout@v7
        with:
          ref: price-history
          path: history
      - name: Record today's prices
        run: node scripts/update-history.mjs history/history.json site/data/history.json
      - name: Save price history
        continue-on-error: true
        working-directory: history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || { git commit -m "Prices for $(date -u +%F)" && git push; }
      - name: Check price alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-watches.mjs
      - name: Test
        run: npm test
      - name: Version asset URLs (cache busting)
        run: node scripts/stamp-version.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub pauses scheduled workflows after 60 days without repository activity,
  # and price updates don't count. If the repo has been quiet for 45 days, commit
  # a date marker so the 6-hourly updates keep running.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Commit a marker if the repo has been quiet for 45+ days
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age days ago."
          if [ "$age" -ge 45 ]; then
            date -u +%Y-%m-%d > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "Keep scheduled price updates alive"
            git push
          fi

  # If a scheduled or manual run crashes outright, say so on the health issue.
  alert:
    needs: [build, deploy]
    if: failure() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create data-health --color d93f0b --description "Automated price data health alerts" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          msg="The scheduled price update failed, so the site wasn't refreshed. Details: $RUN_URL"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --label data-health --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$msg"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "Price data needs attention" --label data-health --body "$msg"
          fi
